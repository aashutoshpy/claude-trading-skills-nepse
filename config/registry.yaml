margin_eligible_symbols: []

# Bikram Sambat → Gregorian quarter-end mapping for FY 2082/83.
# Listed companies must file quarterly unaudited statements within
# the statutory 30-day window after each quarter-end.
nepali_fiscal_year:
  fy_label: "2082/83"
  quarters:
    - q: 1
      ends_gregorian: "2025-10-17"   # ~end of Ashwin
    - q: 2
      ends_gregorian: "2026-01-14"   # ~end of Poush
    - q: 3
      ends_gregorian: "2026-04-13"   # ~end of Chaitra
    - q: 4
      ends_gregorian: "2026-07-16"   # ~end of Ashadh
