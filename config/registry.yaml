# NEPSE universe + sector taxonomy + margin eligibility
#
# Loaded by common.nepse.registry. This file should be regenerated
# from a live `NepseClient.list_constituents()` call periodically;
# the seed values below are documented placeholders so the foundation
# is usable before any live data has been fetched.
#
# Last verified: 2026-05-17 (~284 listed; sector counts from Feb 2026)

# Sector identifiers used across NEPSE skills. Keep these stable —
# Python code references them as string literals. Display names can
# be looked up via `Sector.display_name`.
